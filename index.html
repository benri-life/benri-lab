<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <meta name="description" content="暮らしや資格、PCなどについて紹介するブログです。">

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            line-height: 1.8;
            color: #333;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        article {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            margin: 0;
        }

        h2 {
            border-left: 5px solid #333;
            padding-left: 10px;
        }

        a {
            color: #0066cc;
        }
    </style>
</head>

<body>

<header>
    <h1>My Blog</h1>
    <p>暮らし・資格・PCなど、役立つ情報を紹介します。</p>
</header>

<main>

    <article>
        <h2>このブログについて</h2>

        <p>
            このブログでは、実際に調べたことや試したことを中心に、
            役立つ情報を紹介していきます。
        </p>
    </article>

    <article>
        <h2>これから記事を追加していきます</h2>

        <p>
            資格、PC、ガジェット、生活など、
            いろいろなテーマについて紹介していきます。
        </p>
    </article>

</main>

</body>
</html>
